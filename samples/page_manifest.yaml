# Golden-set manifest: which notebook page each sample photo shows, and which
# rows of the reference workbook it corresponds to.
#
# Established by reading all 12 photos against
# "Samples or examle data/SACHAL SURVEY - IMAGES DATA.xlsx". The 12 photos cover
# a *contiguous* run, KE-570 -> KE-683 == workbook rows 596-882 == 287 rows.
# That is why no manual ground-truth authoring is needed.
#
# `first_row` / `last_row` are 1-based worksheet row numbers (row 1 is the header).
# They are inclusive and must tile the range 596..882 with no gaps or overlaps;
# scripts/build_golden_set.py asserts this.
#
# Two groups straddle a page break -- KE-619 and KE-673 -- and the surveyor
# rewrote the survey number at the top of the continuing page. The workbook
# labels such a group only once, on its first row. `continues_previous_group`
# records this so the assembly stage can be tested against it.
#
# When the full-resolution originals arrive, drop them in samples/images_hires/
# and either name them page_01.jpg .. page_12.jpg or update `source` below.

workbook: "Samples or examle data/SACHAL SURVEY - IMAGES DATA.xlsx"
sheet: "New XLSX Worksheet"
source_folder: "Samples or examle data"

pages:
  - id: page_01
    source: "WhatsApp Image 2026-07-22 at 1.43.14 PM (1).jpeg"
    surveys: "570-586"
    first_row: 596
    last_row: 619
    continues_previous_group: false
    notes: "Struck-out then rewritten meter: 'SCO 813(7)6 | 81376'. Side codes +42 +128 on KE-581."

